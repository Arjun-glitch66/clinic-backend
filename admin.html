<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
    body {
        font-family: Arial;
        background: #f5f7fa;
        padding: 20px;
    }
    h1 {
        color: #2c3e50;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }
    th, td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: center;
    }
    th {
        background: #3498db;
        color: white;
    }
    button {
        background: red;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>📋 Appointments Dashboard</h1>

<table id="table">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Date</th>
    <th>Time</th>
    <th>Service</th>
    <th>Message</th>
    <th>Action</th>
</tr>
</table>

<script>

// 🔐 PASSWORD PROTECTION
const password = prompt("Enter Admin Password:");
if(password !== "admin123"){
    alert("Access Denied");
    window.location.href = "index.html";
} else {
    loadAppointments();
}

// 📥 LOAD DATA
function loadAppointments() {
    fetch("http://localhost:5000/appointments")
    .then(res => res.json())
    .then(data => {
        let table = document.getElementById("table");

        data.forEach(row => {
            let tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row.id}</td>
                <td>${row.name}</td>
                <td>${row.phone}</td>
                <td>${row.date}</td>
                <td>${row.time}</td>
                <td>${row.service}</td>
                <td>${row.message}</td>
                <td><button onclick="deleteRow(${row.id})">❌</button></td>
            `;

            table.appendChild(tr);
        });
    });
}

// ❌ DELETE FUNCTION
function deleteRow(id) {
    fetch(`http://localhost:5000/delete/${id}`, {
        method: "DELETE"
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        location.reload();
    });
}

</script>

</body>
</html>
